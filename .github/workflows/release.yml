name: Release Build

# Builds ytb-player.nro in the cloud when started by hand (Actions > Release Build > Run
# workflow). Releases carry the build that was tried on a console, so publishing one does not
# start this and nothing replaces that file.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-switch-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare cache directories
        run: mkdir -p .cache/portlibs-switch

      - name: Cache Switch portlibs
        uses: actions/cache@v4
        with:
          path: |
            .cache/portlibs-switch
          key: ${{ runner.os }}-switch-portlibs-${{ hashFiles('build.sh', 'CMakeLists.txt', 'vendor/switch-portlibs/build_custom_portlibs.sh', 'vendor/switch-portlibs/ffmpeg/**', 'vendor/switch-portlibs/mpv/**') }}

      - name: Verify Docker
        run: docker version

      - name: Build Switch NRO
        env:
          PORTLIBS_DIR: ${{ github.workspace }}/.cache/portlibs-switch
        run: ./build.sh

      - name: Prepare release artifacts
        run: |
          mkdir -p dist
          cp cmake-build-switch/ytb-player.nro dist/ytb-player.nro
          sha256sum dist/ytb-player.nro > dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytb-player-release
          path: |
            dist/ytb-player.nro
            dist/SHA256SUMS.txt
